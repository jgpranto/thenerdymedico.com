<!DOCTYPE html>
<html>
<head>
    <title>The Nerdy Medico</title>
    <style>
        /* Container that hides the text until it enters the screen */
        .marquee-container {
            background-color: yellow;
            overflow: hidden;
            white-space: nowrap;
            padding: 10px 0;
            font-weight: bold;
        }

        /* The moving text itself */
        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: scroll-left 15s linear infinite;
        }

        /* The animation rules */
        @keyframes scroll-left {
            0% {
                transform: translate3d(0, 0, 0);
            }
            100% {
                transform: translate3d(-100%, 0, 0);
            }
        }
    </style>
</head>
<body>

    <h1>The Nerdy Medico</h1>
    <p>Website coming soon!</p>
    
    <!-- Modern, moving marquee -->
    <div class="marquee-container">
        <div class="marquee-text">
            The Nerdy Medico Coming soon. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 
        </div>
    </div>

</body>
</html>
